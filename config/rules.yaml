# Rules are matched top to bottom; the first match wins.
# The file is reloaded live on SIGHUP (and every RULES_RELOAD_INTERVAL when
# set); an invalid edit is rejected and the previous rules stay in force.
#
# failure_policy: what to do when Redis is unreachable.
#   open   - let traffic through
#   closed - return 503
#   local  - keep limiting with an in-process limiter on each replica, scaled
#            down by local_replicas so the fleet-wide total stays similar
failure_policy: local
local_replicas: 2 # docker-compose runs two limiter replicas

rules:
  # Brute-force protection: exact sliding window per client IP.
  - name: login
    path_prefix: /api/login
    methods: [POST]
    algorithm: sliding_window_log
    limit: 5
    window: 1m

  # Expensive endpoint: each call costs 5 units of a per-API-key budget.
  - name: search
    path_prefix: /api/search
    algorithm: sliding_window_counter
    limit: 100
    window: 1m
    cost: 5
    key: header:X-API-Key

# Everything else: 10 req/s sustained, bursts of 20, per IP.
default:
  algorithm: token_bucket
  limit: 10
  window: 1s
  burst: 20
