# Two limiter replicas share one Redis, so limits hold across instances.
# Run: docker compose up --build
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 10

  limiter-a: &limiter
    build: .
    environment:
      REDIS_ADDR: redis:6379
      RULES_PATH: /app/config/rules.yaml
      RULES_RELOAD_INTERVAL: 10s
    volumes:
      # Mounted so rule edits are picked up live (polling or SIGHUP).
      - ./config:/app/config:ro
    depends_on:
      redis:
        condition: service_healthy
    ports: ["8081:8080"]

  limiter-b:
    <<: *limiter
    ports: ["8082:8080"]

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [limiter-a, limiter-b]

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ratelimiter.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
