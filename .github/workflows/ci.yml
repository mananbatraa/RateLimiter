name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./... && go vet -tags integration ./...
      - name: unit tests
        run: go test -race -cover ./...
      - name: fuzz rules parser (smoke)
        run: go test -run '^$' -fuzz FuzzParseRules -fuzztime 15s ./internal/config/
      - name: integration tests
        env:
          REDIS_ADDR: localhost:6379
        run: go test -race -tags integration ./...
      - name: build image
        run: docker build -t ratelimiter .
