name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --build-tags integration

  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./... && go vet -tags integration ./...
      - name: unit tests
        run: go test -race -cover ./...
      - name: fuzz rules parser (smoke)
        run: go test -run '^$' -fuzz FuzzParseRules -fuzztime 15s ./internal/config/
      - name: integration tests
        env:
          REDIS_ADDR: localhost:6379
        run: go test -race -tags integration ./...
      - name: build image
        run: docker build -t ratelimiter .

  topologies:
    # Redis Cluster (3 masters) and Sentinel, started from redis-server so the
    # Lua scripts are exercised across slots and through master discovery.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: install redis
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: start cluster and sentinel
        run: scripts/redis-topologies.sh up | sed 's/^export //; s/ /\n/g' >> "$GITHUB_ENV"
      - name: topology tests
        run: go test -race -tags integration -run 'Topology|Failover' -v ./cmd/ratelimiter/
